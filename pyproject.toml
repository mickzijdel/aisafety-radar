[project]
name = "aisafety-radar"
version = "0.1.0"
description = "Pipeline that regenerates the aisafety-radar skill every day"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
]

[project.scripts]
radar = "pipeline.cli:main"

[dependency-groups]
# `pyyaml` is here rather than in the runtime dependencies because only the tests read YAML
# (SKILL.md's frontmatter and the workflow files). Phase 5's config-driven source list makes it
# a runtime dependency again; until then a runtime pin would ship a package nothing imports.
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.17,<0.18",
  "pytest-httpx>=0.30",
  "vulture>=2.14",
  "pyyaml>=6.0",
]

[tool.uv]
# Supply-chain cooldown: never resolve a release published in the last 4 days, so a malicious
# version has time to be caught and yanked before it lands here (dev-hooks:dev-env-setup).
exclude-newer = "4 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff also formats Python code fences inside Markdown, and CI runs `ruff format --check .` over
# the whole tree, so the exclusion is repo-wide rather than scoped to one directory. Two reasons,
# and the second is the load-bearing one:
#   - the spec and plan under docs/ carry illustrative snippets that are deliberately compact;
#   - every generated pack under skills/aisafety-radar/references/ is pipeline output whose bytes
#     are checksummed and served, so a formatter rewriting a fenced block there would break the
#     published checksum and the render goldens at once.
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = ["UP031"]  # %-format → .format(): style only, the fix doesn't produce f-strings

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLW1510"]  # tests assert returncode themselves
"**/test_*.py" = ["PLW1510"]
"**/conftest.py" = ["PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
