[project]
name = "aisafety-radar"
version = "0.1.0"
description = "Pipeline that regenerates the aisafety-radar skill every day"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
]

[project.scripts]
radar = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "pytest-httpx>=0.30", "vulture>=2.14"]

[tool.uv]
# Supply-chain cooldown: never resolve a release published in the last 4 days, so a malicious
# version has time to be caught and yanked before it lands here (dev-hooks:dev-env-setup).
exclude-newer = "4 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff also formats Python code fences inside Markdown. The spec and plan under docs/ carry
# illustrative snippets that are deliberately compact, so keep the formatter off Markdown;
# CI runs `ruff format --check .` over the whole tree.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
