# Runtime configuration for the pipeline. The only place model IDs live (see CLAUDE.md); the
# pydantic defaults in pipeline/config.py and pipeline/floor.py are fallbacks, not the source
# of truth. Prices are USD per million tokens.

[models]
haiku = "claude-haiku-4-5"
sonnet = "claude-sonnet-5"

[prices."claude-haiku-4-5"]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 1.25

[prices."claude-sonnet-5"]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5

[caps]
forums_per_day = 25

[budgets]
"00-index" = 1500
"31-today-forums" = 9000

[thresholds]
mover_new_comments = 10
mover_score_change = 0.25
cost_alert_multiplier = 2.0
judge_sample_rate = 0.05

[floor]
comment_karma_min = 3
account_age_days = 30
per_author_per_day = 3
per_source_per_day = 150
anomaly_multiplier = 3.0

[floor.post_karma_min]
lw = 20
eaf = 10
af = 0

[paths]
skill_dir = "skills/aisafety-radar"
